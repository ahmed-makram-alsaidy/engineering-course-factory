# P3 compiler fixture: side-effect safety proof.
# The authored terminal command WOULD create a sentinel file if it were ever
# executed, and the browser URL WOULD be fetched if a browser were ever opened.
# Compilation must treat both as inert DATA: after compiling this fixture, the
# sentinel file must not exist anywhere and the URL must remain untouched text.
# Synthetic P3 sample - NOT production course content.
schema_version: "1.1"
