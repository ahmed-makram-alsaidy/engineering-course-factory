  - "safety"
metadata:
  synthetic_fixture: true
  amendment: "P3"
scenes:
  - scene_id: C01-L090-S001
    type: code_demo
    title: "If this ran, it would leave a trace"
    duration: 120
    visual:
      kind: terminal
      description: "Terminal that is never opened: the command is compiled as data only"
    beats:
      - beat_id: C01-L090-S001-B001
        kind: narration
        narration:
          text: "This command is never run by the compiler; it would create a sentinel file if it were."
      - beat_id: C01-L090-S001-B002
