# Exercises the canonical Phase P8 reference lesson (P8-DESIGN-SPEC Section 31.1):
#   (1) narration intro: "Welcome to the Course Factory full-stack demo."
#   (2) file_create: "src/app.js"
#   (3) type_code: HTTP server in "src/app.js"
#   (4) file_save: commit "src/app.js" to disk
#   (5) terminal_run foreground: "node --check src/app.js"
#   (6) terminal_run background: "node src/app.js" (process_id: "demo_server")
#   (7) wait: until port 3000
#   (8) browser_open: "http://localhost:3000"
#   (9) browser_fill: username-input -> "student"
#   (10) browser_click: Submit button
#   (11) browser_assert: greeting text -> "Welcome student"
